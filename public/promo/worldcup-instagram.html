<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; }
  .card {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #56042C 0%, #8B1538 40%, #56042C 70%, #3D0220 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    position: relative;
    overflow: hidden;
  }
  .bg-ball {
    position: absolute;
    font-size: 120px;
    opacity: 0.06;
  }
  .bg-ball.tl { top: 40px; left: 60px; }
  .bg-ball.tr { top: 80px; right: 80px; }
  .bg-ball.bl { bottom: 60px; left: 100px; }
  .bg-ball.br { bottom: 40px; right: 60px; }
  .bg-ball.mid { top: 50%; left: 15%; font-size: 80px; }
  .bg-ball.mid2 { top: 30%; right: 12%; font-size: 90px; }
  .limited {
    color: #D4A856;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .trophy { font-size: 44px; vertical-align: middle; margin: 0 12px; }
  h1 {
    color: #fff;
    font-size: 82px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  h1 span { color: #D4A856; }
  .discount {
    color: #D4A856;
    font-size: 100px;
    font-weight: 800;
    margin: 20px 0 24px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .desc {
    color: rgba(255,255,255,0.88);
    font-size: 32px;
    max-width: 820px;
    line-height: 1.45;
    margin-bottom: 36px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-bottom: 44px;
  }
  .tag {
    padding: 10px 24px;
    border: 1.5px solid rgba(212,168,86,0.5);
    border-radius: 50px;
    color: #fff;
    font-size: 22px;
    font-family: Arial, Helvetica, sans-serif;
    background: rgba(255,255,255,0.08);
  }
  .shop-name {
    color: #D4A856;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .shop-info {
    color: rgba(255,255,255,0.5);
    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;
  }
  .divider {
    width: 80px;
    height: 2px;
    background: #D4A856;
    margin: 30px auto;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-ball tl">&#9917;</div>
  <div class="bg-ball tr">&#9917;</div>
  <div class="bg-ball bl">&#9917;</div>
  <div class="bg-ball br">&#9917;</div>
  <div class="bg-ball mid">&#9917;</div>
  <div class="bg-ball mid2">&#9917;</div>

  <div class="limited">
    <span class="trophy">&#127942;</span>
    Limited Time Offer
    <span class="trophy">&#127942;</span>
  </div>

  <h1>World Cup <span>2026</span><br>Special</h1>

  <div class="discount">25% OFF</div>

  <div class="desc">
    Frame your World Cup memorabilia &mdash;<br>
    professionally preserved &amp; displayed.
  </div>

  <div class="tags">
    <div class="tag">Jerseys</div>
    <div class="tag">Photographs</div>
    <div class="tag">Flags</div>
    <div class="tag">Scarves</div>
    <div class="tag">Tickets</div>
    <div class="tag">Posters</div>
  </div>

  <div class="divider"></div>

  <div class="shop-name">West Roxbury Framing</div>
  <div class="shop-info">617-327-3890 &bull; 1741 Centre St, West Roxbury</div>
</div>
</body>
</html>
